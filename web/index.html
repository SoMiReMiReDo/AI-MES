<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#163f43" />
        <script>
            // 首帧前同步主题，避免刷新时先按浅色渲染
            (function () {
                try {
                    var theme = localStorage.getItem("mesagent.theme");
                    if (theme === "dark" || theme === "light")
                        document.documentElement.dataset.theme = theme;
                } catch (e) {}
            })();
        </script>
        <title>MESagent · 制造基础工作台</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
