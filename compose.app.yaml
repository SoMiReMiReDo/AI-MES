name: mesagent-delivery

x-postgres-image: &postgres-image postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
x-api-image: &api-image ${COMPOSE_PROJECT_NAME:-mesagent-delivery}-api
x-owner-connection: &owner-connection Host=postgres;Database=mesagent;Username=mesagent_owner;Password=${MES_DB_PASSWORD:?Use scripts/delivery.py init}

services:
  postgres:
    image: *postgres-image
    environment:
      POSTGRES_DB: mesagent
      POSTGRES_USER: mesagent_owner
      POSTGRES_PASSWORD: ${MES_DB_PASSWORD:?Use scripts/delivery.py init}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "mesagent_owner", "-d", "mesagent"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    entrypoint: ["dotnet", "MESagent.Database.dll", "migrate"]
    build: {context: ., dockerfile: deploy/Dockerfile.database}
    environment:
      ConnectionStrings__Mes: *owner-connection
    networks: [database]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  provision:
    image: *postgres-image
    entrypoint: ["/bin/sh", "/delivery/provision.sh"]
    environment:
      PGPASSWORD: ${MES_DB_PASSWORD:?Use scripts/delivery.py init}
      MES_APP_DB_PASSWORD: ${MES_APP_DB_PASSWORD:?Use scripts/delivery.py init}
    volumes:
      - ./deploy/provision.sh:/delivery/provision.sh:ro
      - ./database:/delivery/database:ro
    networks: [database]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

  key-init:
    image: *api-image
    pull_policy: never
    user: "0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ['chown -R "$$APP_UID:$$APP_UID" /state/keys /state/documents && chmod 700 /state/keys /state/documents']
    volumes:
      - api_keys:/state/keys
      - engineering_documents:/state/documents
    network_mode: none
    restart: "no"

  api:
    image: *api-image
    build: {context: ., dockerfile: deploy/Dockerfile.api}
    stop_grace_period: 40s
    environment:
      ConnectionStrings__Mes: Host=postgres;Database=mesagent;Username=mesagent_app;Password=${MES_APP_DB_PASSWORD:?Use scripts/delivery.py init}
      Mes__DeploymentFabId: ${MES_FAB_ID:?Use scripts/delivery.py init}
      ASPNETCORE_ENVIRONMENT: ${MES_ENVIRONMENT:-Development}
      Deployment__ForwardHttps: ${MES_FORWARD_HTTPS:-false}
      DataProtection__Path: /state/keys
      MES_DOCUMENT_ROOT: /state/documents
      Security__LoginPermitLimit: ${MES_LOGIN_LIMIT:-20}
    volumes:
      - api_keys:/state/keys
      - engineering_documents:/state/documents
    networks: [edge, database]
    depends_on:
      provision: {condition: service_completed_successfully}
      key-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "dotnet", "MESagent.Api.dll", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  web:
    build: {context: ., dockerfile: deploy/Dockerfile.web}
    ports: ["127.0.0.1:${MES_WEB_PORT:-5088}:8080"]
    environment:
      MES_PROXY_SCHEME: ${MES_PROXY_SCHEME:-http}
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 4s
      retries: 15
    restart: unless-stopped

  bootstrap:
    profiles: [tools]
    image: *api-image
    pull_policy: never
    entrypoint: ["/bin/sh", "-ec", 'IFS= read -r MES_ADMIN_PASSWORD; export MES_ADMIN_PASSWORD; exec dotnet MESagent.Api.dll bootstrap']
    environment:
      ConnectionStrings__Mes: *owner-connection
      Mes__DeploymentFabId: ${MES_FAB_ID:?Use scripts/delivery.py init}
      DataProtection__Path: /tmp/mes-keys
      MES_FAB_CODE: ${MES_FAB_CODE:-FAB01}
      MES_FAB_TIMEZONE: ${MES_FAB_TIMEZONE:-Asia/Shanghai}
    networks: [database]

  state:
    profiles: [tools]
    image: *postgres-image
    entrypoint: ["/bin/sh", "-ec"]
    user: "0"
    volumes:
      - api_keys:/state/keys
      - engineering_documents:/state/documents
    network_mode: none

networks:
  edge:
  database:
    internal: true

volumes:
  postgres_data:
  api_keys:
  engineering_documents:
