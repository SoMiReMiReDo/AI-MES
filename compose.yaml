name: mesagent
services:
  postgres:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_DB: mesagent
      POSTGRES_USER: mesagent_owner
      POSTGRES_PASSWORD: ${MES_DB_PASSWORD:?Run python3 scripts/database.py init first}
    ports:
      - "127.0.0.1:${MES_DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesagent_owner -d mesagent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
