map $http_upgrade $mesagent_upgrade_connection {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $mesagent_api http://api:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto ${MES_PROXY_SCHEME};

    location /api/v1/workbench/live {
        proxy_pass $mesagent_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto ${MES_PROXY_SCHEME};
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mesagent_upgrade_connection;
        proxy_buffering off;
        proxy_read_timeout 100s;
    }

    location = /api/v1/integration/work-order-imports {
        client_max_body_size 2m;
        proxy_pass $mesagent_api;
    }

    location = /api/v1/engineering/documents {
        client_max_body_size 15m;
        proxy_pass $mesagent_api;
    }

    location /api/ {
        proxy_pass $mesagent_api;
    }

    location /health/ {
        proxy_pass $mesagent_api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
